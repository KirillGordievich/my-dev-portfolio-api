services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - dev_portfolio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  migration:
    image: dev-portfolio-api
    env_file:
      - .env.docker
    command: pnpm exec prisma migrate deploy
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    image: dev-portfolio-api
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "3000:3000"
    depends_on:
      migration:
        condition: service_completed_successfully

volumes:
  dev_portfolio_postgres_data:
